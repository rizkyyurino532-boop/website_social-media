<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Profil Pengguna Konekta" />
    <title>Profil — Konekta</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  </head>
  <body data-page="profile">
    <div class="app-layout">
      <!-- Left Navigation Sidebar -->
      <aside
        class="sidebar-left"
        id="sidebar-left"
        aria-label="Menu Samping Kiri"
      ></aside>

      <!-- Main Center Profile Column -->
      <main class="main-content">
        <header class="page-header">
          <div class="flex items-center gap-2">
            <a
              href="home.html"
              class="btn-icon"
              aria-label="Kembali ke Beranda"
            >
              <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="page-header-title" id="profile-page-title">
              Profil Pengguna
            </h1>
          </div>
          <button
            type="button"
            class="btn-icon"
            data-action="toggle-theme"
            aria-label="Ubah Tema Gelap atau Terang"
            title="Ubah Tema"
          >
            <i data-theme-icon class="fa-solid fa-moon"></i>
          </button>
        </header>

        <!-- Profile Banner, Avatar, Bio & Stats -->
        <section
          id="profile-header-container"
          aria-label="Informasi Profil"
        ></section>

        <!-- Profile Content Tabs (Postingan, Media, Disukai) -->
        <nav class="tabs-nav" aria-label="Tab Konten Profil">
          <button type="button" class="tab-btn active" data-profile-tab="posts">
            <i class="fa-solid fa-bars-staggered"></i> Postingan
          </button>
          <button type="button" class="tab-btn" data-profile-tab="media">
            <i class="fa-regular fa-images"></i> Media
          </button>
          <button type="button" class="tab-btn" data-profile-tab="likes">
            <i class="fa-regular fa-heart"></i> Disukai
          </button>
        </nav>

        <!-- Profile Tab Content -->
        <section
          id="profile-tab-content"
          aria-label="Daftar Konten Profil"
        ></section>
      </main>

      <!-- Right Widgets Sidebar -->
      <aside
        class="sidebar-right"
        id="sidebar-right"
        aria-label="Tren dan Rekomendasi"
      ></aside>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav
      class="bottom-nav"
      id="bottom-nav"
      aria-label="Navigasi Bawah Mobile"
    ></nav>

    <!-- Application Scripts -->
    <script defer src="js/storage.js"></script>
    <script defer src="js/seed.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/notifications.js"></script>
    <script defer src="js/users.js"></script>
    <script defer src="js/posts.js"></script>
    <script defer src="js/chat.js"></script>
    <script defer src="js/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Beranda Konekta - Feed Utama & Stories Komunitas"
    />
    <title>Beranda — Konekta</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  </head>
  <body data-page="home">
    <div class="app-layout">
      <!-- Left Navigation Sidebar -->
      <aside
        class="sidebar-left"
        id="sidebar-left"
        aria-label="Menu Samping Kiri"
      ></aside>

      <!-- Main Center Feed Column -->
      <main class="main-content">
        <header class="page-header">
          <h1 class="page-header-title">
            <i class="fa-solid fa-house text-primary-brand"></i>
            <span>Beranda</span>
          </h1>
          <div class="flex items-center gap-2">
            <button
              type="button"
              class="btn-icon"
              data-action="toggle-theme"
              aria-label="Ubah Tema Gelap atau Terang"
              title="Ubah Tema"
            >
              <i data-theme-icon class="fa-solid fa-moon"></i>
            </button>
            <a
              href="settings.html"
              class="btn-icon"
              aria-label="Pengaturan"
              title="Pengaturan"
            >
              <i class="fa-solid fa-sliders"></i>
            </a>
          </div>
        </header>

        <!-- 24-Hour Stories Bar -->
        <section
          class="stories-container"
          id="stories-bar"
          aria-label="Cerita Pengguna (Stories)"
        ></section>

        <!-- Post Composer -->
        <section class="composer-card" aria-label="Buat Postingan Baru">
          <form id="composer-form" novalidate>
            <div class="composer-top">
              <a href="profile.html" aria-label="Profil Saya">
                <img
                  src="assets/logo.svg"
                  alt="Avatar Pengguna"
                  class="avatar avatar-md"
                  id="composer-user-avatar"
                />
              </a>
              <div class="composer-input-area">
                <textarea
                  id="composer-textarea"
                  class="composer-textarea"
                  placeholder="Apa yang sedang terjadi? Gunakan #hashtag atau @mention..."
                  maxlength="280"
                  aria-label="Tulis isi postingan"
                ></textarea>
                <div
                  class="composer-preview-grid hidden"
                  id="composer-preview-grid"
                ></div>
              </div>
            </div>

            <div class="composer-footer">
              <div class="composer-tools">
                <label
                  for="composer-image-input"
                  class="btn-icon"
                  title="Unggah Gambar (Maks 4)"
                  aria-label="Unggah Gambar"
                >
                  <i class="fa-regular fa-image"></i>
                </label>
                <input
                  type="file"
                  id="composer-image-input"
                  accept="image/*"
                  multiple
                  class="hidden"
                />

                <div class="dropdown">
                  <button
                    type="button"
                    class="btn-icon"
                    id="composer-emoji-trigger"
                    title="Sisipkan Emoji"
                    aria-label="Sisipkan Emoji"
                  >
                    <i class="fa-regular fa-face-smile"></i>
                  </button>
                  <div
                    class="emoji-picker-popover hidden"
                    id="composer-emoji-popover"
                  ></div>
                </div>
              </div>

              <div class="composer-submit-group">
                <span
                  class="char-counter"
                  id="composer-char-counter"
                  aria-live="polite"
                  >0/280</span
                >
                <button
                  type="submit"
                  class="btn btn-primary"
                  id="composer-submit-btn"
                >
                  <i class="fa-solid fa-paper-plane"></i>
                  <span>Posting</span>
                </button>
              </div>
            </div>
          </form>
        </section>

        <!-- Feed Filter Tabs -->
        <nav class="tabs-nav" aria-label="Filter Feed Beranda">
          <button
            type="button"
            class="tab-btn active"
            data-feed-tab="following"
          >
            Mengikuti
          </button>
          <button type="button" class="tab-btn" data-feed-tab="foryou">
            Untuk Anda
          </button>
          <button type="button" class="tab-btn" data-feed-tab="bookmarks">
            <i class="fa-regular fa-bookmark"></i> Tersimpan
          </button>
        </nav>

        <!-- Feed Posts List -->
        <section
          id="feed-posts-container"
          aria-label="Daftar Postingan"
        ></section>

        <!-- Infinite Scroll Sentinel & Load More Button -->
        <div id="feed-sentinel" class="flex items-center justify-between">
          <button
            type="button"
            class="btn btn-secondary btn-block hidden"
            id="load-more-btn"
          >
            <i class="fa-solid fa-rotate"></i>
            <span>Muat Lebih Banyak Postingan</span>
          </button>
        </div>
      </main>

      <!-- Right Widgets Sidebar -->
      <aside
        class="sidebar-right"
        id="sidebar-right"
        aria-label="Tren dan Rekomendasi"
      ></aside>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav
      class="bottom-nav"
      id="bottom-nav"
      aria-label="Navigasi Bawah Mobile"
    ></nav>

    <!-- Application Scripts -->
    <script defer src="js/storage.js"></script>
    <script defer src="js/seed.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/notifications.js"></script>
    <script defer src="js/users.js"></script>
    <script defer src="js/posts.js"></script>
    <script defer src="js/chat.js"></script>
    <script defer src="js/app.js"></script>
  </body>
</html>
